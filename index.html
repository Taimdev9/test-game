<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألعاب أونلاين</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card" id="authScreen">
        <h1>🎮 ألعاب أونلاين</h1>
        
        <input type="email" id="email" placeholder="الإيميل">
        <input type="password" id="password" placeholder="كلمة السر">
        
        <button class="btn btn-primary" id="loginBtn">تسجيل دخول</button>
        <button class="btn btn-outline" id="signupBtn">إنشاء حساب جديد</button>
        
        <h2 style="text-align:center; font-size:14px; color:#999;">أو</h2>
        
        <button class="btn btn-google" id="googleBtn">🔵 دخول بحساب Google</button>
        <button class="btn btn-guest" id="guestBtn">👤 دخول كزائر</button>
        
        <div class="status" id="authStatus"></div>
    </div>

    <div class="card" id="menuScreen" style="display:none;">
        <div class="menu-header">
            <span class="user-badge" id="userBadge">لاعب</span>
            <button class="btn btn-danger" id="logoutBtn" style="width:auto; padding:8px 15px;">خروج</button>
        </div>
        
        <h1>🎯 اختر لعبة</h1>
        <div class="game-grid" id="gameGrid"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
    <script>
        const authScreen = document.getElementById('authScreen');
        const menuScreen = document.getElementById('menuScreen');
        const statusEl = document.getElementById('authStatus');

        function showStatus(msg, type = 'error') {
            statusEl.textContent = msg;
            statusEl.className = 'status ' + type;
        }

        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            if (!email || !pass) return showStatus('املأ كل الحقول');
            try { await Auth.login(email, pass); } 
            catch (e) { showStatus(e.message); }
        };

        document.getElementById('signupBtn').onclick = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            if (!email || !pass) return showStatus('املأ كل الحقول');
            if (pass.length < 6) return showStatus('كلمة السر 6 أحرف على الأقل');
            try { await Auth.signup(email, pass); } 
            catch (e) { showStatus(e.message); }
        };

        document.getElementById('googleBtn').onclick = async () => {
            try { await Auth.google(); } catch (e) { showStatus(e.message); }
        };

        document.getElementById('guestBtn').onclick = async () => {
            try { await Auth.guest(); } catch (e) { showStatus(e.message); }
        };

        document.getElementById('logoutBtn').onclick = () => Auth.logout();

        const grid = document.getElementById('gameGrid');
        Object.entries(GAMES).forEach(([key, g]) => {
            const a = document.createElement('a');
            a.className = 'game-card';
            a.href = 'lobby.html?game=' + key;
            a.innerHTML = `<span class="icon">${g.icon}</span><span class="name">${g.name}</span>
                           <div style="font-size:12px;color:#888;margin-top:5px;">${g.desc}</div>`;
            grid.appendChild(a);
        });

        auth.onAuthStateChanged(user => {
            if (user) {
                authScreen.style.display = 'none';
                menuScreen.style.display = 'block';
                document.getElementById('userBadge').textContent = '👤 ' + getUserName(user);
            } else {
                authScreen.style.display = 'block';
                menuScreen.style.display = 'none';
            }
        });
    </script>
</body>
</html>
