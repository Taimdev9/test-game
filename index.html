<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GameVerse</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#18181b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GameVerse">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%2318181b'/%3E%3Ctext x='50%25' y='50%25' font-size='300' text-anchor='middle' dominant-baseline='central' fill='white'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loader">
            <div class="text"><span>TAIMDEV9</span></div>
            <div class="text"><span>TAIMDEV9</span></div>
            <div class="text"><span>TAIMDEV9</span></div>
            <div class="text"><span>TAIMDEV9</span></div>
            <div class="text"><span>TAIMDEV9</span></div>
            <div class="text"><span>TAIMDEV9</span></div>
            <div class="text"><span>TAIMDEV9</span></div>
            <div class="text"><span>TAIMDEV9</span></div>
            <div class="text"><span>TAIMDEV9</span></div>
            <div class="line"></div>
        </div>
        <div class="loading-by">dev Taimdev9</div>
    </div>

    <div class="container" id="authScreen" style="display:none; padding-top:70px;">
        <div class="card" style="max-width:420px; margin:0 auto;">
            <form class="auth-form" onsubmit="return false;">
                <p class="welcome">مرحباً بك<span>سجّل دخولك للمتابعة</span></p>
                <button type="button" class="oauth-btn" id="googleBtn">
                    <span class="icon"><svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg></span>
                    المتابعة باستخدام Google
                </button>
                <button type="button" class="oauth-btn" id="guestBtn">
                    <span class="icon" id="guestIcon"></span>
                    المتابعة كزائر
                </button>
                <div class="separator"><div class="line"></div><span>أو</span><div class="line"></div></div>
                <input type="email" id="email" placeholder="البريد الإلكتروني">
                <input type="password" id="password" placeholder="كلمة السر">
                <button type="button" class="btn btn-primary" id="loginBtn">تسجيل الدخول</button>
                <button type="button" class="btn btn-outline" id="signupBtn">إنشاء حساب جديد</button>
                <div style="text-align:center; margin-top:8px;">
                    <a href="#" id="forgotBtn" style="color:var(--text-dim); font-size:12px; text-decoration:none;">نسيت كلمة السر؟</a>
                </div>
            </form>
        </div>
    </div>

    <div id="mainApp" style="display:none;">
        <div class="topbar">
            <button class="menu-btn" id="openDrawer"><span id="menuIcon"></span></button>
            <div style="font-weight:900; font-size:17px;">GameVerse</div>
            <div class="coin-badge"><span id="coinIcon"></span><span id="coinDisplay">0</span></div>
        </div>
        <div class="container">
            <div class="card">
                <h1>اختر لعبة</h1>
                <div class="games-grid" id="gamesGrid"></div>
            </div>
        </div>
    </div>

    <div class="drawer-overlay" id="drawerOverlay"></div>
    <aside class="drawer" id="drawer">
        <div class="drawer-header">
            <div class="avatar" id="drawerAvatar"></div>
            <div>
                <div style="font-weight:700; font-size:14px;" id="drawerName">لاعب</div>
                <div style="color:var(--text-dim); font-size:12px;" id="drawerEmail"></div>
            </div>
        </div>
        <ul class="drawer-nav">
            <li><a href="profile.html"><span id="navProfile"></span> الملف الشخصي</a></li>
            <li><a href="settings.html"><span id="navSettings"></span> الإعدادات</a></li>
            <li><a href="profile.html#missions"><span id="navMissions"></span> المهام اليومية</a></li>
            <li><a href="leaderboard.html"><span id="navLeaderboard"></span> المتصدرون</a></li>
            <li><a href="#" id="logoutBtn"><span id="navLogout"></span> تسجيل خروج</a></li>
        </ul>
    </aside>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="icons.js"></script>
    <script src="i18n.js"></script>
    <script src="music.js"></script>
    <script src="app.js"></script>
    <script>
        document.getElementById('guestIcon').innerHTML = ICONS.user;
        document.getElementById('menuIcon').innerHTML = ICONS.menu;
        document.getElementById('coinIcon').innerHTML = ICONS.coin;
        document.getElementById('navProfile').innerHTML = ICONS.profile;
        document.getElementById('navSettings').innerHTML = ICONS.settings;
        document.getElementById('navMissions').innerHTML = ICONS.missions;
        document.getElementById('navLeaderboard').innerHTML = ICONS.trophy;
        document.getElementById('navLogout').innerHTML = ICONS.logout;

        const loadingScreen = document.getElementById('loadingScreen');
        const authScreen = document.getElementById('authScreen');
        const mainApp = document.getElementById('mainApp');
        let loadingDone = false, currentUser = null;

        function finishLoading(user) {
            if (loadingDone) return;
            loadingDone = true;
            const duration = user ? 5000 : 7000;
            setTimeout(() => {
                loadingScreen.classList.add('hide');
                if (user) setupApp(user);
                else authScreen.style.display = 'block';
            }, duration);
        }
        setTimeout(() => { if (!loadingDone) finishLoading(currentUser); }, 9000);
        auth.onAuthStateChanged(user => { currentUser = user; finishLoading(user); });

        async function setupApp(user) {
            const profile = await User.getOrCreate(user);
            window.__user = user; window.__profile = profile;
            authScreen.style.display = 'none';
            mainApp.style.display = 'block';
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            Object.entries(GAMES).forEach(([key, g]) => {
                const a = document.createElement('a');
                a.className = 'game-tile';
                a.href = 'lobby.html?game=' + key;
                a.innerHTML = `<div class="icon">${g.icon}</div><div class="name">${g.name}</div><div class="players-tag">${g.min}-${g.max} لاعبين</div>`;
                grid.appendChild(a);
            });
            document.getElementById('drawerName').textContent = profile.name;
            document.getElementById('drawerEmail').textContent = profile.email || (profile.isGuest ? 'زائر' : '');
            document.getElementById('drawerAvatar').innerHTML = getAvatarSVG(profile.avatar);
            updateCoinDisplay(profile.coins);
            startPresence(user.uid);
            db.ref('users/' + user.uid + '/coins').on('value', s => { if (s.exists()) updateCoinDisplay(s.val()); });
            db.ref('users/' + user.uid + '/avatar').on('value', s => {
                if (s.exists()) document.getElementById('drawerAvatar').innerHTML = getAvatarSVG(s.val());
            });
        }

        const showErr = e => toast(e.message || 'خطأ', 'error');
        document.getElementById('loginBtn').onclick = async () => {
            const e = document.getElementById('email').value.trim(), p = document.getElementById('password').value;
            if (!e || !p) return toast('املأ الحقول', 'error');
            try { await Auth.login(e, p); } catch (err) { showErr(err); }
        };
        document.getElementById('signupBtn').onclick = async () => {
            const e = document.getElementById('email').value.trim(), p = document.getElementById('password').value;
            if (!e || !p) return toast('املأ الحقول', 'error');
            if (p.length < 6) return toast('كلمة السر 6 أحرف على الأقل', 'error');
            try { await Auth.signup(e, p); } catch (err) { showErr(err); }
        };
        document.getElementById('googleBtn').onclick = async () => { try { await Auth.google(); } catch (err) { showErr(err); } };
        document.getElementById('guestBtn').onclick = async () => { try { await Auth.guest(); } catch (err) { showErr(err); } };
        document.getElementById('forgotBtn').onclick = async e => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) return toast('اكتب إيميلك أولاً', 'error');
            try { await auth.sendPasswordResetEmail(email); toast('تم إرسال الرابط ✅', 'success'); } catch (err) { showErr(err); }
        };
        const drawer = document.getElementById('drawer'), overlay = document.getElementById('drawerOverlay');
        document.getElementById('openDrawer').onclick = () => { drawer.classList.add('open'); overlay.classList.add('open'); };
        overlay.onclick = () => { drawer.classList.remove('open'); overlay.classList.remove('open'); };
        document.getElementById('logoutBtn').onclick = async e => { e.preventDefault(); await Auth.logout(); location.reload(); };

        // ============ Service Worker ============
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('✅ Service Worker registered:', reg.scope);
                }).catch(err => console.log('❌ Service Worker failed:', err));
            });
        }
    </script>
</body>
</html>
