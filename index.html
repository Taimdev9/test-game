<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVerse - ألعاب أونلاين</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>
<body>
    <!-- شاشة التحميل -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-logo">🎮</div>
        <div class="loader">
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
            <div class="text"><span>LOADING</span></div>
            <div class="line"></div>
        </div>
        <div class="loading-author">dev <b>Taimdev9</b></div>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div class="container" id="authScreen" style="display:none;">
        <div class="glass">
            <form class="auth-form" onsubmit="return false;">
                <p class="welcome gradient-text">
                    مرحباً بك 👋
                    <span>سجّل دخولك للمتابعة إلى GameVerse</span>
                </p>

                <!-- Google -->
                <button type="button" class="oauth-btn" id="googleBtn">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    الدخول بحساب Google
                </button>

                <!-- Guest -->
                <button type="button" class="oauth-btn" id="guestBtn">
                    👤 الدخول كزائر
                </button>

                <div class="separator">
                    <div class="line"></div>
                    <span>أو</span>
                    <div class="line"></div>
                </div>

                <!-- Email + Password -->
                <input type="email" id="email" placeholder="البريد الإلكتروني">
                <input type="password" id="password" placeholder="كلمة السر">

                <button type="button" class="btn btn-primary" id="loginBtn">
                    🔓 تسجيل دخول
                </button>
                <button type="button" class="btn btn-glass" id="signupBtn">
                    ✨ إنشاء حساب جديد
                </button>

                <div style="text-align:center; margin-top:8px;">
                    <a href="#" id="forgotBtn" style="color:var(--text-dim); font-size:13px; text-decoration:none;">نسيت كلمة السر؟</a>
                </div>
            </form>
        </div>
    </div>

    <!-- القائمة الرئيسية -->
    <div id="mainApp" style="display:none;">
        <div class="topbar">
            <button class="menu-btn" id="openDrawer">☰</button>
            <div style="font-weight:900; font-size:18px;" class="gradient-text">GameVerse</div>
            <div class="coin-badge">🪙 <span id="coinDisplay">0</span></div>
        </div>
        <div class="container">
            <div class="glass">
                <h1>اختر لعبة</h1>
                <div class="games-grid" id="gamesGrid"></div>
            </div>
        </div>
    </div>

    <!-- القائمة الجانبية -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <aside class="drawer" id="drawer">
        <div class="drawer-header">
            <div class="avatar" id="drawerAvatar">🎮</div>
            <div>
                <div style="font-weight:700;" id="drawerName">لاعب</div>
                <div style="color:var(--text-dim); font-size:13px;" id="drawerEmail"></div>
            </div>
        </div>
        <ul class="drawer-nav">
            <li><a href="profile.html"><span class="icon">👤</span> الملف الشخصي</a></li>
            <li><a href="settings.html"><span class="icon">⚙️</span> الإعدادات</a></li>
            <li><a href="profile.html#missions"><span class="icon">🎯</span> المهام اليومية</a></li>
            <li><a href="#" id="logoutBtn"><span class="icon">🚪</span> تسجيل خروج</a></li>
        </ul>
    </aside>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
    <script src="missions.js"></script>
    <script>
        const loadingScreen = document.getElementById('loadingScreen');
        const authScreen = document.getElementById('authScreen');
        const mainApp = document.getElementById('mainApp');

        let loadingDone = false;
        let currentUser = null;

        function finishLoading(user) {
            if (loadingDone) return;
            loadingDone = true;

            const duration = user ? 5000 : 7000;
            const startTime = Date.now();
            setTimeout(() => {
                loadingScreen.classList.add('hide');
                if (user) {
                    setupApp(user);
                } else {
                    authScreen.style.display = 'block';
                }
            }, duration);
        }

        setTimeout(() => {
            if (!loadingDone) {
                console.warn('Auth timeout - forcing load');
                finishLoading(currentUser);
            }
        }, 9000);

        auth.onAuthStateChanged(user => {
            currentUser = user;
            finishLoading(user);
        });

        async function setupApp(user) {
            const profile = await User.getOrCreate(user);
            window.__user = user;
            window.__profile = profile;

            authScreen.style.display = 'none';
            mainApp.style.display = 'block';

            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            Object.entries(GAMES).forEach(([key, g]) => {
                const a = document.createElement('a');
                a.className = 'game-tile';
                a.href = 'lobby.html?game=' + key;
                a.innerHTML = `
                    <span class="icon">${g.icon}</span>
                    <div class="name">${g.name}</div>
                    <div class="players-tag">${g.min}-${g.max} لاعبين</div>
                `;
                grid.appendChild(a);
            });

            document.getElementById('drawerName').textContent = profile.name;
            document.getElementById('drawerEmail').textContent = profile.email || (profile.isGuest ? 'زائر' : '');
            document.getElementById('drawerAvatar').textContent = profile.avatar || '🎮';
            updateCoinDisplay(profile.coins);
            startPresence(user.uid);

            db.ref('users/' + user.uid + '/coins').on('value', s => {
                if (s.exists()) updateCoinDisplay(s.val());
            });
        }

        // ============ Auth ============
        const showErr = (e) => toast(e.message || 'خطأ', 'error');

        document.getElementById('loginBtn').onclick = async () => {
            const e = document.getElementById('email').value.trim();
            const p = document.getElementById('password').value;
            if (!e || !p) return toast('املأ الحقول', 'error');
            try { await Auth.login(e, p); } catch (err) { showErr(err); }
        };
        document.getElementById('signupBtn').onclick = async () => {
            const e = document.getElementById('email').value.trim();
            const p = document.getElementById('password').value;
            if (!e || !p) return toast('املأ الحقول', 'error');
            if (p.length < 6) return toast('كلمة السر 6 أحرف على الأقل', 'error');
            try { await Auth.signup(e, p); } catch (err) { showErr(err); }
        };
        document.getElementById('googleBtn').onclick = async () => {
            try { await Auth.google(); } catch (err) { showErr(err); }
        };
        document.getElementById('guestBtn').onclick = async () => {
            try { await Auth.guest(); } catch (err) { showErr(err); }
        };
        document.getElementById('forgotBtn').onclick = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) return toast('اكتب إيميلك أولاً', 'error');
            try {
                await auth.sendPasswordResetEmail(email);
                toast('تم إرسال رابط إعادة التعيين لإيميلك ✅', 'success');
            } catch (err) { showErr(err); }
        };

        // ============ Drawer ============
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('drawerOverlay');
        document.getElementById('openDrawer').onclick = () => {
            drawer.classList.add('open');
            overlay.classList.add('open');
        };
        overlay.onclick = () => {
            drawer.classList.remove('open');
            overlay.classList.remove('open');
        };
        document.getElementById('logoutBtn').onclick = async (e) => {
            e.preventDefault();
            await Auth.logout();
            location.reload();
        };
    </script>
</body>
</html>
