<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرسم والتخمين</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topbar">
        <a href="index.html" class="menu-btn" style="text-decoration:none;">←</a>
        <div style="font-weight:900;">🎨 الرسم والتخمين</div>
        <div class="coin-badge">🪙 <span id="coinDisplay">0</span></div>
    </div>

    <div class="container">
        <div class="glass">
            <div class="turn-indicator" id="turnIndicator">...</div>
            
            <div id="drawerPanel" style="display:none;">
                <h3 style="text-align:center; margin-bottom:12px;">الكلمة: <span class="gradient-text" id="secretWord" style="font-size:24px;"></span></h3>
                <div class="canvas-wrap">
                    <canvas id="drawCanvas" width="600" height="400"></canvas>
                </div>
                <div class="color-picker" id="colorPicker"></div>
                <div class="brush-size" id="brushSizes">
                    <button class="brush-btn active" data-size="3">رفيع</button>
                    <button class="brush-btn" data-size="8">متوسط</button>
                    <button class="brush-btn" data-size="16">سميك</button>
                </div>
                <button class="btn btn-glass" id="clearBtn">🗑️ مسح الكل</button>
            </div>
            
            <div id="guesserPanel" style="display:none;">
                <div class="canvas-wrap">
                    <canvas id="viewCanvas" width="600" height="400"></canvas>
                </div>
                <input type="text" id="guessInput" placeholder="اكتب تخمينك...">
                <button class="btn btn-primary" id="guessBtn">🎯 خمّن</button>
            </div>
            
            <div id="scoreBoard" style="margin-top:16px;"></div>
            
            <h2 style="margin-top:20px;">💬 الدردشة</h2>
            <div id="chatContainer"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
    <script src="missions.js"></script>
    <script src="chat.js"></script>
    <script>
        const DRAW_WORDS = ['كلب','قطة','بيت','شمس','قمر','شجرة','سيارة','طائرة','سمكة','زهرة','كتاب','ساعة','كرسي','طاولة','تفاحة','موز','جبل','بحر','نجمة','قلب','مفتاح','شمعة','حاسوب','هاتف'];
        
        const params = new URLSearchParams(location.search);
        const roomCode = params.get('room');
        if (!roomCode) location.href = 'index.html';
        
        let user, profile, roomRef, room, isDrawer = false, chatRendered = false;
        let drawing = false, lastX = 0, lastY = 0, currentColor = '#000000', currentSize = 3;
        let canvasListenersSet = false, lastDrawVersion = -1;
        
        const colors = ['#000000','#e53935','#1976d2','#43a047','#fbc02d','#8e24aa','#fb8c00','#00acc1','#795548','#ffffff'];
        const colorPicker = document.getElementById('colorPicker');
        colors.forEach((c, i) => {
            const d = document.createElement('div');
            d.className = 'color-dot' + (i === 0 ? ' active' : '');
            d.style.background = c;
            d.onclick = () => {
                currentColor = c;
                colorPicker.querySelectorAll('.color-dot').forEach(x => x.classList.remove('active'));
                d.classList.add('active');
            };
            colorPicker.appendChild(d);
        });
        
        document.querySelectorAll('.brush-btn').forEach(b => {
            b.onclick = () => {
                currentSize = +b.dataset.size;
                document.querySelectorAll('.brush-btn').forEach(x => x.classList.remove('active'));
                b.classList.add('active');
            };
        });

        requireAuth((u, p) => {
            user = u; profile = p;
            updateCoinDisplay(p.coins);
            roomRef = Rooms.get(roomCode);
            Rooms.listen(roomCode, onRoomUpdate);
            startRound();
        });

        async function startRound() {
            // ابدأ جولة جديدة بعد 2 ثواني
            await new Promise(r => setTimeout(r, 2000));
            const snap = await roomRef.once('value');
            const r = snap.val();
            if (!r || r.state?.status === 'playing') return;
            newRound();
        }

        async function newRound() {
            const snap = await roomRef.once('value');
            const r = snap.val();
            const ids = Object.keys(r.players);
            const drawerIdx = Math.floor(Math.random() * ids.length);
            const drawer = ids[drawerIdx];
            const word = DRAW_WORDS[Math.floor(Math.random() * DRAW_WORDS.length)];
            
            await roomRef.child('state').set({
                status: 'playing',
                drawer,
                word,
                guesses: {},
                scores: r.state?.scores || {},
                strokes: [],
                startedAt: Date.now()
            });
        }

        function onRoomUpdate(snap) {
            room = snap.val();
            if (!room) { location.href = 'index.html'; return; }
            
            if (!chatRendered) {
                renderChat(document.getElementById('chatContainer'), roomCode, user, profile);
                chatRendered = true;
            }
            
            const s = room.state;
            if (!s) { setTurnIndicator('جاري التحضير...'); return; }
            
            isDrawer = s.drawer === user.uid;
            
            // تحديث لوحة المتصدرين
            renderScores(s.scores || {});
            
            // إذا في فائز
            if (s.winner) {
                const winnerName = room.players[s.winner]?.name || '؟';
                setTurnIndicator(`🎉 ${winnerName} خمّن الكلمة! الكلمة كانت: ${s.word}`, false);
                setTimeout(() => { if (room?.state?.winner) newRound(); }, 4000);
                return;
            }
            
            if (isDrawer) {
                document.getElementById('drawerPanel').style.display = 'block';
                document.getElementById('guesserPanel').style.display = 'none';
                document.getElementById('secretWord').textContent = s.word;
                setTurnIndicator('🎨 ارسم الكلمة للباقي!', true);
                setupCanvas();
                if (!canvasListenersSet) { attachDrawEvents(); canvasListenersSet = true; }
                // ارسم الستروكس الموجودة
                redrawFromStrokes(s.strokes || []);
            } else {
                document.getElementById('drawerPanel').style.display = 'none';
                document.getElementById('guesserPanel').style.display = 'block';
                setTurnIndicator('🕵️ خمّن الرسمة!', true);
                redrawFromStrokes(s.strokes || [], 'viewCanvas');
            }
        }

        function setTurnIndicator(t, my) {
            const el = document.getElementById('turnIndicator');
            el.textContent = t;
            el.className = 'turn-indicator' + (my ? ' my-turn' : '');
        }

        function renderScores(scores) {
            const board = document.getElementById('scoreBoard');
            const entries = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            if (entries.length === 0) { board.innerHTML = ''; return; }
            board.innerHTML = '<h3>النقاط</h3>' + entries.map(([uid, sc], i) => 
                `<div class="player-item"><div style="width:24px;font-weight:900;">${i + 1}</div>
                 <div class="name">${escapeHtml(room.players[uid]?.name || '؟')}</div>
                 <div style="color:var(--gold);font-weight:700;">${sc}</div></div>`
            ).join('');
        }

        // ============ Canvas Drawing ============
        function setupCanvas() {
            const c = document.getElementById('drawCanvas');
            const ctx = c.getContext('2d');
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, c.width, c.height);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        function attachDrawEvents() {
            const c = document.getElementById('drawCanvas');
            const ctx = c.getContext('2d');
            
            const getPos = (e) => {
                const rect = c.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
                return { x: x * (c.width / rect.width), y: y * (c.height / rect.height) };
            };
            
            const start = (e) => {
                e.preventDefault();
                drawing = true;
                const p = getPos(e);
                lastX = p.x; lastY = p.y;
            };
            
            const move = (e) => {
                if (!drawing) return;
                e.preventDefault();
                const p = getPos(e);
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = currentSize;
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
                
                // خزّن الستروك
                roomRef.child('state/strokes').push({
                    x1: lastX, y1: lastY, x2: p.x, y2: p.y,
                    color: currentColor, size: currentSize
                });
                
                lastX = p.x; lastY = p.y;
            };
            
            const end = () => { drawing = false; };
            
            c.addEventListener('mousedown', start);
            c.addEventListener('mousemove', move);
            c.addEventListener('mouseup', end);
            c.addEventListener('mouseleave', end);
            c.addEventListener('touchstart', start, { passive: false });
            c.addEventListener('touchmove', move, { passive: false });
            c.addEventListener('touchend', end);
        }

        function redrawFromStrokes(strokes, canvasId = 'drawCanvas') {
            const c = document.getElementById(canvasId);
            if (!c) return;
            const ctx = c.getContext('2d');
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, c.width, c.height);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            Object.values(strokes).forEach(s => {
                ctx.strokeStyle = s.color;
                ctx.lineWidth = s.size;
                ctx.beginPath();
                ctx.moveTo(s.x1, s.y1);
                ctx.lineTo(s.x2, s.y2);
                ctx.stroke();
            });
        }

        // observer للستروكس الجديدة للمشاهد
        db.ref(`rooms/${roomCode}/state/strokes`).limitToLast(1).on('child_added', snap => {
            if (isDrawer) return;
            const c = document.getElementById('viewCanvas');
            if (!c) return;
            const s = snap.val();
            const ctx = c.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = s.color;
            ctx.lineWidth = s.size;
            ctx.beginPath();
            ctx.moveTo(s.x1, s.y1);
            ctx.lineTo(s.x2, s.y2);
            ctx.stroke();
        });

        document.getElementById('clearBtn').onclick = async () => {
            if (!isDrawer) return;
            await roomRef.child('state/strokes').remove();
            setupCanvas();
        };

        // ============ Guessing ============
        document.getElementById('guessBtn').onclick = async () => {
            const g = document.getElementById('guessInput').value.trim();
            if (!g || !room.state) return;
            document.getElementById('guessInput').value = '';
            
            // سجل التخمين في الدردشة
            Chat.send(roomCode, user, profile.name, '💭 ' + g);
            
            // قارن الكلمة (تجاهل التشكيل والهمزات والحالة)
            const normalize = (s) => s.trim().replace(/[\u064B-\u0652]/g, '').replace(/[أإآا]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase();
            
            if (normalize(g) === normalize(room.state.word)) {
                // صحيح!
                await roomRef.child('state/winner').set(user.uid);
                await roomRef.child('state/scores/' + user.uid).transaction(v => (v || 0) + 3);
                // نقاط للرسام
                await roomRef.child('state/scores/' + room.state.drawer).transaction(v => (v || 0) + 1);
                await User.addCoins(user.uid, 5);
            }
        };
        
        document.getElementById('guessInput').onkeypress = (e) => {
            if (e.key === 'Enter') document.getElementById('guessBtn').click();
        };
    </script>
</body>
</html>
